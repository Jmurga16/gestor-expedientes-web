<p-card [header]="headerTitle">

    <div class="flex justify-content-between align-items-center flex-column sm:flex-row gap-2 mb-3">

        <span class="p-input-icon-left w-full sm:w-20rem">
            <i class="pi pi-search"></i>
            <input pInputText type="text" (input)="onGlobalFilter(dataTable1, $event)" placeholder="Buscar"
                class="w-full" />
        </span>

        <div class="flex gap-2">
            <p-button type="button" label="Exportar" icon="pi pi-fw pi-file-excel" severity="secondary"
                [outlined]="true" [loading]="exporting" (click)="exportar()"></p-button>

            <p-button type="button" label="Nuevo" icon="pi pi-fw pi-plus" (click)="goToNew()"></p-button>
        </div>
    </div>

    <p-table #dataTable1 [value]="datatable" dataKey="id" [loading]="loading" [rowHover]="true" [lazy]="true"
        (onLazyLoad)="getDatatable($event)" [paginator]="true" [rows]="request.pageSize" [totalRecords]="totalRecords"
        [rowsPerPageOptions]="[5, 10, 20]" [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        styleClass="p-datatable-gridlines" responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr>
                <!-- <th style="width: 15%">
                    <div class="flex justify-content-between align-items-center">
                        Fecha Apertura
                    </div>
                </th> -->
                <th style="width: 15%;">
                    <div class="flex justify-content-between align-items-center">
                        Demandante
                    </div>
                </th>
                <th style="width: 15%;">
                    <div class="flex justify-content-between align-items-center">
                        DNI
                    </div>
                </th>
                <th style="width: 15%;">
                    <div class="flex justify-content-between align-items-center">
                        Caratula
                    </div>
                </th>
                <th style="width: 15%;">
                    <div class="flex justify-content-between align-items-center">
                        Descripción
                    </div>
                </th>
                <th style="width: 15%">
                    <div class="flex justify-content-between align-items-center">
                        Paso
                    </div>
                </th>
                <th style="width: 15%">
                    <div class="flex justify-content-between align-items-center">
                        Estado
                    </div>
                </th>
                <th class="col-opciones">
                    <div class="flex justify-content-center align-items-center">
                        Opciones
                    </div>
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-demanda>
            <tr>
                <!-- <td>
                    {{demanda.fechaApertura}}
                </td> -->
                <td>
                    {{demanda.demandante}}
                </td>
                <td>
                    {{demanda.dni}}
                </td>
                <td>
                    {{demanda.caratula}}
                </td>
                <td>
                    {{demanda.informacionAdicional}}
                </td>
                <td>
                    {{demanda.paso}}
                </td>
                <td>
                    {{demanda.estado | steptask}}
                </td>
                <td class="col-opciones text-center">
                    <button pButton pRipple type="button" [icon]="demanda.puedeEditar ? 'pi pi-pencil' : 'pi pi-eye'"
                        (click)="goToEdit(demanda.id)" [pTooltip]="demanda.puedeEditar ? 'Editar' : 'Ver datos'"
                        class="p-button-rounded p-button-text p-button-tbl">
                    </button>

                    <button pButton pRipple type="button" icon="pi pi-sitemap" (click)="goToDiagram(demanda.id)"
                        pTooltip="Ver diagrama" class="p-button-rounded p-button-text p-button-tbl">
                    </button>

                    <button *ngIf="demanda.puedeEliminar" pButton pRipple type="button" icon="pi pi-trash" (click)="deleteById(demanda.id)"
                        pTooltip="Eliminar" class="p-button-rounded p-button-text p-button-tbl">
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="8">No se encontraron registros.</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="8">Cargando...</td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
