<h3>BPMN</h3>

<div class="diagram-parent">
    <app-diagram [url]="urlBPMN" [idDemanda]="idDemanda" [readonly]="readonly"
        [pasoActual]="pasoActual" [estadoActual]="estadoActual" (importDone)="handleImported($event)"
        (fileBPMN)="onChangeDiagram($event)" (pasos)="listPasos($event)"></app-diagram>

    <div class="import-error" *ngIf="importError">
        <strong>Falló el diagrama: </strong>
        {{ importError.message }}
    </div>
</div>
